# Điền các TODO trước khi chạy agent. Dùng dấu / hoặc \\ trong đường dẫn.
project_root: "D:/Kì 7/Hoc_sau_ver4"

paths:
  kaggle_dir: "data/fashion-dataset"
  checkpoint_dir: "data/checkpoints_siglip-vit"      # đường dẫn checkpoints_siglip-vit
  train_code: "notebooks/siglip_vietnamese_ecommerce_colab_ver2.ipynb"          # notebook/script đã train (để lấy preprocessing)
  old_images: "data/images"
  crawled_images: "data/images_crawled/new/images"
  catalog: "data/catalog/catalog.parquet"
  quarantine: "data/_quarantine"
  index_dir: "index"
  reports_dir: "reports"
  eval_dir: "eval"
  brands_path: "src/brands_v2.json"
  brands_sha256: "c5283096f649351d4433874915e2e32586118200e576f41b3101495859c1898e"

checkpoint:
  format: "pt_state_dict"              # save_pretrained | pt_state_dict | pt_full_model | big_vision
  model_name: "google/siglip-so400m-patch14-224"          # ví dụ tên model gốc dùng để dựng kiến trúc (nếu là state_dict)
  text_language_in_training: "vi"   # en | vi | mixed
  checkpoint_hash: "e2f82fee26c786c2ea9e521d8341e7bbfc29c0980cebac46688c5522ff64215d"
  embedding_dim: 1152
  max_text_length: 128
  text_padding: "max_length"           # khớp code train colab padding='max_length'

image_filter:                 # CHỈ là giá trị khởi đầu; chốt sau khi tôi duyệt contact sheet
  min_short_side: 224
  blur_laplacian_var_threshold: 12.0
  phash_hamming_threshold: 1
  dedup_match_attributes: ["articleType", "gender", "baseColour"]
  dedup_transitive: false
  detect_banner: true

faiss:
  type: "IndexHNSWFlat"
  M: 32
  ef_construction: 200
  ef_search: 128
  metric: "inner_product"

eval:
  seed: 42
  topk: [1, 5, 10]
  min_relevant_per_query: 5
  n_text_queries: 400
  n_latency_queries: 200
  handwritten_queries: "eval/handwritten_queries.json"   # tôi tự viết, 50-100 câu
  min_group_size_for_queries: 10   # nhóm (articleType, gender[, baseColour]) nhỏ hơn thì không sinh truy vấn test
  quality_device: "cpu"            # pipeline chuẩn đánh giá chất lượng (CPU Scorer centering)
  quality_precision: "float32"     # chuẩn ma trận float32 bảo đảm tính tái lập bit-to-bit
  latency_device: "cuda"           # pipeline phục vụ suy luận thời gian thực (VisualSearchEngine)
  latency_precision: "float16"     # GPU PyTorch half-precision
  tie_rule: "conservative"         # báo song song hoặc bi quan (pessimistic / conservative)

scoring:
  mu_gamma: 0.3                    # trọng số cộng điểm mềm (soft bonus) khi khớp thuộc tính danh mục/giới tính
  csls: false                      # Cross-Domain Similarity Local Scaling (không kích hoạt)

latency:
  sla_metric: "p95"                # chỉ tiêu SLA chuẩn của hệ thống (AGENTS.md)
  sla_ms: 200                      # ngưỡng trễ SLA (< 200 ms)
  risk_metric: "p99"               # chỉ số rủi ro đuôi phân phối (tail risk metric)

app:
  port: 8501

scope:
  index_scope: "fashion_only"   # fashion_only | all
  exclude_master_categories: ["Personal Care", "Home", "Sporting Goods"]
  exclude_article_types: ["Ipad", "Free Gifts", "Fragrance Gift Set", "Key chain"]   # agent đề xuất thêm, tôi duyệt
  keep_fashion_article_types_in_free_items: true  # Backpacks, Handbags, Wallets, Ties, Scarves, Clutches, Laptop Bag...

embedding:
  batch_size: 64
  fp16: true

inference:
  phase: "3g"
  gamma: 0.3                      # winning parameter from validation grid
  alpha: 1.0                      # selected alpha*=1.0 (gap=0.0052 <= 0.0100 to save 170MB RAM)
  rrf_k: 60                       # fixed reciprocal rank fusion parameter
  min_candidates: 20              # multi-level relaxation threshold
  enable_parser: true
  enable_bm25: true
  enable_text_fusion: false       # frozen to false based on F3 rule
  use_usage: false                # independent filter verification flag
  use_season: false               # independent filter verification flag
  filter_mode: "relaxed"          # "relaxed" tương ứng C1, C2, C3, C5; "none" tương ứng C0 (Dense thuần); C4 là BM25 thuần
  scoring_mode: "mean_centered"   # mu_shared centering
