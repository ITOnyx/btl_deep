# config.yaml — SigLIP + Dense Captioning E-commerce Visual Search
# Nguồn: AGENTS.md (luật bất biến) + context.md (đề cương).
# Dùng dấu / trong đường dẫn. Mọi đường dẫn tương đối so với project_root.
# Các giá trị đánh dấu [KHỞI ĐẦU] chỉ chốt sau khi người dùng duyệt.
 
project_root: "D:/Kì 7/Hoc_sau_ver4"
seed: 42                                   # Luật: seed cố định cho mọi phân chia và thao tác ngẫu nhiên
 
# ---------------------------------------------------------------- Chỉ tiêu (context.md)
targets:
  recall_at_10: 0.85
  t2i_map: 0.75
  latency_ms_p95: 200                      # đo riêng từng luồng
  report_metrics: ["Recall@1", "Recall@5", "Recall@10", "mAP"]
  no_lowering_targets: true                # Luật 7 + mục C.10: không tự hạ chuẩn
 
# ---------------------------------------------------------------- Đường dẫn
paths:
  kaggle_dir: "data/fashion-dataset"
  checkpoint_dir: "data/checkpoints_siglip-vit"
  checkpoint_file: "data/checkpoints_siglip-vit/best_model.pt"   # chỉ đọc
  train_code: "notebooks/siglip_vietnamese_ecommerce_colab_ver2.ipynb"  # chỉ đọc, để lấy preprocessing
  old_images: "data/images"
  crawled_images: "data/images_crawled/new/images"
  catalog: "data/catalog/catalog.parquet"
  quarantine: "data/_quarantine"
  index_dir: "index"                       # index mới dựng ở index/<index_version>/, không ghi đè index_v* cũ
  reports_dir: "reports"
  eval_dir: "eval"
  captions_dir: "data/catalog/captions"    # shard caption mới (InternVL2-2B)
  quarantine_log: "reports/quarantine_log.csv"
  brands_path: "src/brands_v2.json"
  brands_sha256: "c5283096f649351d4433874915e2e32586118200e576f41b3101495859c1898e"
 
# ---------------------------------------------------------------- Quyền ghi (Luật 2, 3)
safety:
  allowed_write: ["src/", "app/", "reports/", "eval/", "index/", "data/catalog/", "data/_quarantine/", "scripts/", "config.yaml", "README_run.md"]
  read_only: ["notebooks/", "docs/", "data/checkpoints_siglip-vit/"]
  never_overwrite_existing: ["index_v*/", "data/catalog/catalog.parquet"]
  permanent_delete: false                  # chỉ chuyển vào quarantine + ghi log
  hash_guard: true                         # Luật 6: so checkpoint_hash với manifest.json trước khi nạp
  allow_training: false                    # Luật 1: cấm train/fine-tune/sửa checkpoint
 
# ---------------------------------------------------------------- Checkpoint (dùng lại, không train)
checkpoint:
  format: "pt_state_dict"
  model_name: "google/siglip-so400m-patch14-224"
  text_language_in_training: "vi"
  checkpoint_hash: "e2f82fee26c786c2ea9e521d8341e7bbfc29c0980cebac46688c5522ff64215d"
  embedding_dim: 1152
  l2_normalize: true
  max_text_length: 128
  text_padding: "max_length"
 
# ---------------------------------------------------------------- Tiền xử lý (Luật 4) — MỘT đường code dùng chung
preprocess:
  image_resize: [224, 224]
  image_interpolation: "BILINEAR"
  image_processor: "SiglipProcessor"
  text_max_length: 128
  text_padding: "max_length"
  parity_check:                            # chạy trước khi embed số lượng lớn
    n_samples: 200
    min_cosine: 0.999                      # nhỏ nhất < 0.999 => DỪNG
    halt_on_fail: true
 
# ---------------------------------------------------------------- Lọc ảnh [KHỞI ĐẦU]
image_filter:
  min_short_side: 224
  blur_laplacian_var_threshold: 12.0
  phash_hamming_threshold: 1
  dedup_hashes: ["sha1", "phash"]
  dedup_match_attributes: ["articleType", "gender", "baseColour"]
  dedup_transitive: false
  detect_banner: true
 
# ---------------------------------------------------------------- Nguồn dữ liệu (Pha 1)
sources:
  kaggle_fashion:
    path: "data/fashion-dataset"
    status: "available"
    format: "styles.csv"
    schema: "myntra_styles"
    language: "en"
    license: "CC0: Public Domain"
    n_images_raw: 44424
  shopping100k:
    path: "data/Shopping100k"
    status: "available_on_disk_out_of_catalog_scope"
    format: "attributes_and_images"
    language: "en"
    license: "Academic non-commercial"
    n_images_raw: 100713
  tiki_crawled:
    path: "data/images_crawled"
    status: "not_available"
    license: "N/A"

# ---------------------------------------------------------------- Phân chia dữ liệu
split:
  mode: "inherit_checkpoint_train"          # Kế thừa: sản phẩm checkpoint đã thấy -> train; test chỉ lấy từ unseen
  by: "product"                            # chia theo sản phẩm, trước mọi bước khác
  seed: 42
  lock_test_list: true
  test_list_path: "eval/test_split.json"
  test_list_hash_path: "eval/test_split.sha256"
  val_list_path: "eval/val_split.json"
 
# ---------------------------------------------------------------- Dense caption (InternVL2-2B + bổ trợ theo Luật 5)
captioning:
  caption_model: "OpenGVLab/InternVL2-2B"  # model sinh caption chính (bắt buộc theo context.md, Luật 5)
  model_revision: "e4f6747bd20f139e637642c6a058c6bd00b36919"  # commit revision HF chính thức
  quantization: "8bit"                     # Người dùng đã duyệt Phương án A (8-bit quantization qua bitsandbytes)
  allow_auxiliary_methods: true            # Luật 5: cho phép kết hợp Vintern hoặc hậu xử lý bổ trợ cho InternVL2-2B
  configs:
    A:
      description: "Chính, lõi: Chỉ InternVL2-2B (+ hậu xử lý chuẩn hóa không đổi nội dung)"
      primary_model: "OpenGVLab/InternVL2-2B"
      auxiliary_models: []
      strategy: "core_only"
      quantization: "8bit"
    B:
      description: "Kết hợp: InternVL2-2B + Bổ trợ (Vintern, trích xuất thuộc tính, hợp nhất luật)"
      primary_model: "OpenGVLab/InternVL2-2B"
      auxiliary_models: ["5CD-AI/Vintern-1B-v3_5", "metadata_extractor", "rule_cleaner"]
      strategy: "merge_deterministic"
      quantization: "8bit"
    C:
      description: "Tham chiếu: Chỉ model bổ trợ (Vintern-1B-v3_5)"
      primary_model: "5CD-AI/Vintern-1B-v3_5"
      auxiliary_models: []
      strategy: "aux_only"
      reference_only: true
      quantization: "8bit"
  aux: ["5CD-AI/Vintern-1B-v3_5", "metadata_extractor", "rule_cleaner"]  # Danh sách aux đã duyệt ở Pha 1/2
  auxiliary_models:                        # danh mục khảo sát
    - name: "5CD-AI/Vintern-1B-v3_5"
      role: "vietnamese_supplement"
      model_revision: "b98f263eab246eb5269ade64edbdca8a887dc44d"
      enabled: true
      quantization: "8bit"
  combination_strategy: "merge_v1"         # none | merge_v1 | postprocess | attribute_enrich | select
  require_provenance_fields: ["caption_model", "model_revision", "seed", "generation_params", "combination_method"]
  language: "vi"
  seed: 42
  dtype: "int8"
  generation:
    max_new_tokens: 96
    do_sample: false
    num_beams: 1
  pilot_n_images: 200                      # thử 200 ảnh rồi dừng chờ duyệt
  manual_review_n: 20
  max_total_tokens: 128                    # đo bằng tokenizer SigLIP; phần phân biệt đứng đầu câu
  discriminative_first: ["articleType", "gender", "baseColour", "style"]
  shard_size: 1000
  resume: true
  error_log: "reports/caption_errors.csv"
  vram_check_required: true                # không đủ FP16 => báo phương án, không tự hạ chất lượng
  allow_auto_quantization: false
  # Ghi chú: caption cũ đã thay được chuyển vào quarantine kèm log (Luật 2, mục D.7).
 
# ---------------------------------------------------------------- Embedding
embedding:
  batch_size: 64
  fp16: true
 
# ---------------------------------------------------------------- FAISS
faiss:
  type: "IndexHNSWFlat"
  dim: 1152
  M: 32
  ef_construction: 200
  ef_search: 128
  metric: "inner_product"                  # trên vector L2-normalized => cosine
  manifest_name: "manifest.json"
  manifest_fields: ["checkpoint_hash", "catalog_hash", "n_vectors", "hnsw_params", "commit_hash", "seed"]
 
sanity_check:                              # bắt buộc ở Pha 4
  max_duplicate_ids: 0
  max_test_leak_into_train: 0
  self_query_rank1: true
  self_query_min_cosine: 0.9999
  n_vectors_match_manifest: true
 
# ---------------------------------------------------------------- Phạm vi catalog
scope:
  index_scope: "fashion_only"
  exclude_master_categories: ["Personal Care", "Home", "Sporting Goods"]
  exclude_article_types: ["Ipad", "Free Gifts", "Fragrance Gift Set", "Key chain", "Water Bottle", "Perfume and Body Mist"]
  include_article_type_exceptions: ["Wristbands"]   # phụ kiện thời trang hợp lệ (bỏ ràng buộc ép 38.644)
  keep_fashion_article_types_in_free_items: true    # Backpacks, Handbags, Wallets, Ties, Scarves, Clutches, Laptop Bag...
 
# ---------------------------------------------------------------- Đánh giá
eval:
  seed: 42
  topk: [1, 5, 10]
  official_gallery: "test_split"           # chỉ tiêu chính thức chỉ đối chiếu trên gallery test split
  reference_gallery: "full"                # chứa ảnh train => ghi nhãn "ước lượng lạc quan (tham khảo)"
  report_separately: ["model_only", "system"]   # Model thuần vs Hệ thống (parser, lexicon, soft bonus)
  report_caption_configs_separately: ["internvl2_only", "internvl2_plus_auxiliary"]  # Luật 5: tách riêng baseline và kết hợp bổ trợ
  breakdowns: ["thin_slot", "colour", "gender"]
  min_relevant_per_query: 5
  min_group_size_for_queries: 10
  n_text_queries: 400
  # Luật C.5: Bộ truy vấn handwritten_queries.json đã chạy ở Pha 5 và được quan sát kết quả để chẩn đoán.
  # Do đó, theo đúng quy định C.5, tập này chuyển nhãn chính thức thành DEV SET (chỉ dùng chẩn đoán lỗi, KHÔNG dùng để tune tham số).
  dev_set_queries: "eval/handwritten_queries.json"
  handwritten_queries: "eval/handwritten_queries.json"   # Alias DEV SET (phục vụ tương thích ngược)
  dev_set_reason: "Đã quan sát kết quả tại Pha 5; chuyển nhãn DEV SET theo Luật C.5 để tránh overfitting/leakage."
  heldout_queries_v2: "eval/heldout_queries_v2.json"     # Tập unseen test mới sẽ xây dựng ở Bước 5
  unseen_queries_run_once: true            # chỉnh parser/lexicon sau khi xem => đổi nhãn DEV SET
  bootstrap: { n_resamples: 1000, ci: 0.95 }
  hubness:
    measure: true
    top_k: 10
    try_mean_centering: true               # báo cáo trước/sau
  quality_device: "cpu"
  quality_precision: "float32"
  tie_rule: "conservative"
  gender_gt:
    policy_file: "eval/gender_gt_policy.json"
    official: "hybrid"                     # hybrid | strict | relaxed
    report_also: ["strict", "relaxed"]
 
# ---------------------------------------------------------------- Độ trễ (đo riêng từng luồng)
latency:
  device: "cuda"
  precision: "float16"
  n_queries: 200
  min_runs: 5
  warmup_queries: 20
  cuda_synchronize: true                   # torch.cuda.synchronize() quanh forward
  log_gpu_temperature: true
  percentiles: [50, 95, 99]
  sla_metric: "p95"
  risk_metric: "p99"
  sla_ms: 200                              # giữ để tương thích code cũ
  flows:
    text_to_image:  { sla_ms: 200 }
    image_to_image: { sla_ms: 200 }
    cir_catalog:    { sla_ms: 200 }
    cir_upload:     { sla_ms: 200 }
 
# ---------------------------------------------------------------- Chấm điểm
scoring:
  legacy: true                             # đánh dấu legacy: cần kiểm lại trên val, không chỉnh trên test
  mu_gamma: 0.3                            # soft bonus khi khớp danh mục/giới tính (đồng bộ inference.gamma)
  csls: false
 
# ---------------------------------------------------------------- Suy luận / phục vụ
inference:
  legacy: true                             # đánh dấu legacy: cần kiểm lại trên val, không chỉnh trên test
  phase: "3g"
  gamma: 0.3
  alpha: 1.0                               # alpha*=1.0 (gap 0.0052 <= 0.0100, tiết kiệm 170MB RAM)
  rrf_k: 60
  min_candidates: 20
  enable_parser: true
  enable_bm25: true
  enable_text_fusion: false                # đóng băng theo luật F3
  use_usage: false
  use_season: false
  filter_mode: "relaxed"                   # relaxed = C1,C2,C3,C5; none = C0; C4 = BM25 thuần
  scoring_mode: "mean_centered"
  query_languages: ["vi_diacritics", "vi_no_diacritics"]
  cir_modifier_language_note: "combiner train với modifier tiếng Anh; chỉ cải thiện ở tầng suy luận"
 
serving:
  index_version: "v2"                      # v2 | v3_S | v3_M | v3_L
  i2i_mode: "fast"                         # fast (1 ảnh) | accurate (batch-2 TTA flip)
  use_flip_aug: false                      # chỉ true khi i2i_mode == accurate
  gpu_preprocess: false                    # chỉ bật sau khi qua kiểm tra tương đương
  gpu_preprocess_min_cosine: 0.999
  top_k_display: 10                        # hiển thị Top-10 kèm độ tương đồng
  modes: ["text_to_image", "image_to_image", "cir"]
 
# ---------------------------------------------------------------- Chặn nhầm lẫn lĩnh vực & Xếp hạng 3 tầng (Pha 6+)
domain_ranking:
  candidate_pool_k: 200
  weights:
    domain_hard_filter: true
    domain_mismatch_penalty: 2.0
    group_mismatch_penalty: 1.20
    type_mismatch_penalty: 0.15
    type_match_bonus: 0.85
    color_match_bonus: 0.75
    gender_match_bonus: 0.25
    gender_mismatch_penalty: 0.25

app:
  framework: "streamlit"
  port: 8501

# ---------------------------------------------------------------- Crawl v2 (Out-of-domain Showcase >=10,000 ảnh sạch)
crawl_v2:
  seed: 42
  user_agent: "AcademicResearchBot/2.0 (Hoc_sau_ver4 Vietnamese Fashion Visual Search; non-commercial academic evaluation; contact: nguyen-student@university.edu.vn)"
  max_req_per_sec_per_domain: 1.0
  max_concurrent_per_domain: 2
  max_domain_workers: 11
  timeout_sec: 15
  max_retries: 3
  backoff_factor: 1.5
  one_image_per_product: true
  preserve_raw_bytes: true
  paths:
    data_dir: "data/crawl_v2"
    images_dir: "data/crawl_v2/images"
    quarantine_dir: "data/crawl_v2/_quarantine"
    raw_state_file: "data/crawl_v2/raw_crawled.jsonl"
    reports_dir: "reports/crawl_v2"
    robots_dir: "reports/crawl_v2/robots"
    crawl_log_csv: "reports/crawl_v2/crawl_log.csv"
    quarantine_log_csv: "reports/crawl_v2/quarantine_log.csv"
    metadata_csv: "reports/crawl_v2/metadata.csv"
    metadata_jsonl: "reports/crawl_v2/metadata.jsonl"
    dataset_summary_md: "reports/crawl_v2/dataset_summary.md"
    readme_md: "reports/crawl_v2/README.md"
    run_manifest_json: "reports/crawl_v2/run_manifest.json"
    gallery_dir: "reports/crawl_v2/gallery"
    thumbs_dir: "reports/crawl_v2/gallery/thumbs"
  quality_filter:
    min_short_side: 224
    blur_laplacian_threshold: 12.0
    phash_hamming_threshold: 1
    dedup_hashes: ["sha1", "phash"]
  quotas:
    pilot_total: 200
    full_raw_target: 13000
    per_source:
      ivymoda: 2500
      aristino: 1650
      bitis: 1450
      yame: 1350
      matkinhshady: 1350
      watchstore: 1350
      juno: 1100
      coolmate: 1000
      rabity: 850
      mia: 220
      leonardo: 180
